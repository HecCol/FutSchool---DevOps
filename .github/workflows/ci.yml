name: CI FutSchool

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar-repositorio:
    name: Validar repositorio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verificar README
        run: |
          if [ ! -s README.md ]; then
            echo "Error: README.md no existe o está vacío."
            exit 1
          fi
          echo "README.md correcto."

      - name: Verificar carpetas del proyecto
        run: |
          for carpeta in app ci docs; do
            if [ ! -d "$carpeta" ]; then
              echo "Error: falta la carpeta $carpeta."
              exit 1
            fi
          done
          echo "Las carpetas app, ci y docs están presentes."
      - name: Analizar código con SonarQube
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Fallo controlado para probar notificación
        run: |
          echo "Prueba intencional del aviso a Discord."
          exit 1
      - name: Notificar fallo en Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MENSAJE="❌ Falló el CI de FutSchool. Revisa: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg contenido "$MENSAJE" \
            '{content: $contenido, allowed_mentions: {parse: []}}' > mensaje.json
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @mensaje.json \
            "$DISCORD_WEBHOOK_URL"