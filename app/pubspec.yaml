name: futschool
description: "Aplicación móvil de FutSchool para torneos escolares."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5 <4.0.0'

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  file_selector: ^1.1.0
  flutter_svg: ^2.3.0
  firebase_crashlytics: ^5.4.1
  firebase_performance: ^0.11.7
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.2
  http: ^1.6.0
  image_picker: ^1.2.4
  permission_handler: ^12.0.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma/auth/
    - assets/figma/admin/
    - assets/figma/captain/
